<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>解除成功</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>ボタンをタップせよ</h1>

    <!-- 10秒カウントダウン -->
    <img id="countdownGif" src="images/countdown.gif" alt="カウントダウン">

    <!-- 成功　-->
    <img id="achievePic" src="images/achieve.png" alt="成功演出">

    <script>
    const countdownGif = document.getElementById("countdownGif");
    const achievePic = document.getElementById("achievePic");

    const countdownSound = new Audio("sounds/tiktak.mp3");
    const clearSound = new Audio("sounds/clear.mp3");

    achievePic.style.display = "none";
    countdownGif.style.display = "none";

    // 画面を押したらカウントダウン開始
    document.addEventListener("click", function() {
        countdownGif.style.display = "block";
        countdownSound.volume = 1.0;
        countdownSound.play();

        // 10秒後に爆発
        setTimeout(function() {

            countdownGif.style.display = "none";
            achievePic.style.display = "block";

            countdownSound.pause();

            clearSound.volume = 1.0;
            clearSound.play();

        }, 9000);

    }, { once: true });
</script>
