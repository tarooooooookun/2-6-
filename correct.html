<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>正解</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>...</h1>

    <!-- 10秒カウントダウン -->
    <img id="countdownGif" src="images/countdown.gif" alt="カウントダウン">

    <!-- 正解PNG -->
    <img id="achieveImage" src="images/achieve.png" alt="正解">

    <script>
        const countdownGif = document.getElementById("countdownGif");
        const achieveImage = document.getElementById("achieveImage");
        const countdownSound = new Audio("sounds/tiktak.mp3");
        const clearSound = new Audio("sounds/clear.mp3");

        // 最初は正解画像を隠す
        achieveImage.style.display = "none";

        // 10秒後に正解画像を表示
        setTimeout(function() {

            countdownGif.style.display = "none";
            achieveImage.style.display = "block";

               // カウントダウン音を停止
            countdownSound.pause();

        // 爆発音を再生
            clearSound.play();

            

            // 5秒後に元のページへ
            setTimeout(function() {
                window.location.href = "index.html";
            }, 15000);

        }, 9000);
    </script>

</body>
</html>
