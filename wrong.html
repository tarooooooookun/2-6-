<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>不正解</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>ボタンを押してくれ</h1>
    <button id="nextButton" onclick="window.location.href='next.html'">
    次へ進む
　　　</button>
　　 <img id="buttonPic" src="images/button.png" alt="ボタン">
    <!-- 10秒カウントダウン -->
    <img id="countdownGif" src="images/countdown.gif" alt="カウントダウン">

    <!-- 爆発GIF -->
    <img id="explosionGif" src="images/explosion.gif" alt="爆発演出">

    <script>
    const title = document.querySelector("h1");
    const countdownGif = document.getElementById("countdownGif");
    const explosionGif = document.getElementById("explosionGif");
    const buttonPic = document.getElementById("buttonPic");

    const countdownSound = new Audio("sounds/tiktak.mp3");
    const explosionSound = new Audio("sounds/explosion.mp3");

    explosionGif.style.display = "none";
    countdownGif.style.display = "none";

    // 画面を押したらカウントダウン開始
    document.addEventListener("click", function() {
        buttonPic.style.display = "none";
        title.style.display = "none";
        countdownGif.style.display = "block";
        countdownSound.volume = 1.0;
        countdownSound.play();

        // 10秒後に爆発
        setTimeout(function() {

            countdownGif.style.display = "none";
            explosionGif.style.display = "block";

            countdownSound.pause();

            explosionSound.volume = 1.0;
            explosionSound.play();
// 爆発音が始まってから5秒後にボタンを表示
　　　　 setTimeout(function() {
    　　document.getElementById("nextButton").style.display = "block";
}, 5000);

        }, 9900);

    }, { once: true });



</script>
