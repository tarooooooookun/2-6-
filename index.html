<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>爆弾解除</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>回答を入力せよ</h1>

    <p>答えを入力してください。</p>

    <input type="text" id="answer">
    <button onclick="checkAnswer()">回答する</button>

    <p id="result"></p>

    <!-- GIFを表示する場所 -->
    <img id="bombGif" src="images/bomb.gif" alt="演出" style="display: none;">

    <script>
        function checkAnswer() {
            const answer = document.getElementById("answer").value;
            const bombGif = document.getElementById("bombGif");

            if (answer === "タゴサク") {
                document.getElementById("result").textContent = "正解！";

                // GIFを隠す
                bombGif.style.display = "none";

            } else {
                document.getElementById("result").textContent = "不正解……";

                // GIFを表示
                bombGif.style.display = "block";
            }
        }
    </script>
</body>
</html>
